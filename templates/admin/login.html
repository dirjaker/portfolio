<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录</title>
    <style>
        :root {
            {% for key, val in theme_vars.items() %}
            {{ key }}: {{ val }};
            {% endfor %}
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg-primary, #f8f6f1);
            color: var(--text-primary, #1a1a1a);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        /* 网格背景 */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--border, #e8e5dd) 1px, transparent 1px),
                linear-gradient(90deg, var(--border, #e8e5dd) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }
        
        /* 装饰性背景元素 */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
        }
        .bg-decoration-1 {
            width: 400px;
            height: 400px;
            background: var(--accent, #4f6eff);
            top: -100px;
            right: -100px;
        }
        .bg-decoration-2 {
            width: 300px;
            height: 300px;
            background: var(--accent, #4f6eff);
            bottom: -80px;
            left: -80px;
        }
        
        /* 登录卡片 - 毛玻璃效果 */
        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        
        /* 暗色主题适配 */
        @media (prefers-color-scheme: dark) {
            .login-card {
                background: rgba(30, 30, 40, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 
                    0 8px 32px rgba(0, 0, 0, 0.3),
                    0 2px 8px rgba(0, 0, 0, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }
        }
        
        /* Logo区域 */
        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }
        
        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent, #4f6eff), #7c9fff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(79, 110, 255, 0.3);
        }
        
        .login-logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }
        
        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary, #1a1a1a);
            margin-bottom: 4px;
        }
        
        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary, #888);
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary, #666);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border, #e0ddd5);
            border-radius: 12px;
            color: var(--text-primary, #1a1a1a);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            border-color: var(--accent, #4f6eff);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(79, 110, 255, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-secondary, #aaa);
        }
        
        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent, #4f6eff), #6b8aff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(79, 110, 255, 0.3);
            letter-spacing: 0.5px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 110, 255, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        /* 错误提示 */
        .error-msg {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.2);
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .error-msg svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        /* 底部信息 */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border, #e8e6e1);
        }
        
        .login-footer p {
            font-size: 12px;
            color: var(--text-secondary, #999);
        }
        
        /* 响应式 */
        @media (max-width: 480px) {
            .login-card {
                margin: 16px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="bg-decoration bg-decoration-1"></div>
    <div class="bg-decoration bg-decoration-2"></div>
    
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="login-title">管理后台</h1>
            <p class="login-subtitle">Portfolio Admin Dashboard</p>
        </div>
        
        {% if error %}
        <div class="error-msg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post" action="/admin/login">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="login-btn">登 录</button>
        </form>
        
        <div class="login-footer">
            <p>Powered by FastAPI + Vue3</p>
        </div>
    </div>
</body>
</html>
