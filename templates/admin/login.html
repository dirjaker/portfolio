<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f0; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #fff; border: 1px solid #e0ddd5; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 28px; text-align: center; color: #1a1a1a; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
        input { width: 100%; padding: 10px 14px; background: #fafaf8; border: 1px solid #d0cdc5; border-radius: 8px; color: #1a1a1a; font-size: 14px; outline: none; }
        input:focus { border-color: #4f6eff; background: #fff; }
        button { width: 100%; padding: 10px; background: #4f6eff; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        button:hover { background: #3d5bd9; }
        .error { background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>管理后台登录</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
