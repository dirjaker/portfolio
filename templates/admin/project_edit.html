<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Edit" if project else "New" }} Project - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .admin-nav { background: #12121a; border-bottom: 1px solid #27272a; padding: 0 24px; display: flex; align-items: center; height: 56px; }
        .admin-nav a { color: #a1a1aa; text-decoration: none; padding: 16px 16px; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; }
        .admin-nav a:hover, .admin-nav a.active { color: #e4e4e7; border-bottom-color: #4f8eff; }
        .admin-nav .spacer { flex: 1; }
        .admin-nav .brand { color: #4f8eff; font-weight: 700; font-size: 16px; margin-right: 24px; }
        .content { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #a1a1aa; margin-bottom: 6px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 10px 14px; background: #12121a; border: 1px solid #27272a; border-radius: 8px; color: #e4e4e7; font-size: 14px; font-family: inherit; outline: none; }
        input:focus, textarea:focus { border-color: #4f8eff; }
        textarea { min-height: 120px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .checkbox-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
        .checkbox-row label { display: flex; align-items: center; gap: 8px; color: #e4e4e7; cursor: pointer; }
        .checkbox-row input { width: auto; }
        .btn { padding: 10px 24px; background: #4f8eff; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #3b7aed; }
        .btn-ghost { background: transparent; border: 1px solid #27272a; color: #a1a1aa; }
        .btn-ghost:hover { border-color: #4f8eff; color: #4f8eff; }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        .error { background: #2d1215; border: 1px solid #5c1a1a; color: #f87171; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <span class="brand">Admin</span>
        <a href="/admin">Dashboard</a>
        <a href="/admin/projects" class="active">Projects</a>
        <a href="/admin/profile">Profile</a>
        <a href="/admin/themes">Themes</a>
        <a href="/admin/analytics">Analytics</a>
        <span class="spacer"></span>
        <a href="/" target="_blank">View Site</a>
        <a href="/admin/logout">Logout</a>
    </nav>
    <div class="content">
        <h1>{{ "Edit Project" if project else "New Project" }}</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/projects/save">
            <input type="hidden" name="pid" value="{{ project.id if project else 0 }}">
            <div class="row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ project.name if project else '' }}" required>
                </div>
                <div class="form-group">
                    <label>Slug</label>
                    <input type="text" name="slug" value="{{ project.slug if project else '' }}" required>
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" value="{{ project.description if project else '' }}">
            </div>
            <div class="form-group">
                <label>Detail (Markdown/HTML)</label>
                <textarea name="detail">{{ project.detail if project else '' }}</textarea>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Tech Stack (comma-separated)</label>
                    <input type="text" name="tech_stack" value="{{ project.tech_stack if project else '' }}">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" name="category" value="{{ project.category if project else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>GitHub URL</label>
                    <input type="text" name="github_url" value="{{ project.github_url if project else '' }}">
                </div>
                <div class="form-group">
                    <label>Web URL</label>
                    <input type="text" name="web_url" value="{{ project.web_url if project else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Pages URL</label>
                    <input type="text" name="pages_url" value="{{ project.pages_url if project else '' }}">
                </div>
                <div class="form-group">
                    <label>Sort Order</label>
                    <input type="number" name="sort_order" value="{{ project.sort_order if project else 0 }}">
                </div>
            </div>
            <div class="checkbox-row">
                <label><input type="checkbox" name="is_visible" value="1" {{ 'checked' if not project or project.is_visible else '' }}> Visible</label>
                <label><input type="checkbox" name="show_github" value="1" {{ 'checked' if not project or project.show_github else '' }}> Show GitHub</label>
                <label><input type="checkbox" name="show_web" value="1" {{ 'checked' if not project or project.show_web else '' }}> Show Web</label>
                <label><input type="checkbox" name="show_pages" value="1" {{ 'checked' if not project or project.show_pages else '' }}> Show Pages</label>
                <label><input type="checkbox" name="show_tech" value="1" {{ 'checked' if not project or project.show_tech else '' }}> Show Tech</label>
                <label><input type="checkbox" name="show_detail" value="1" {{ 'checked' if not project or project.show_detail else '' }}> Show Detail</label>
            </div>
            <div class="actions">
                <button type="submit" class="btn">Save Project</button>
                <a href="/admin/projects" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
