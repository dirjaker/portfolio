<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .admin-nav { background: #12121a; border-bottom: 1px solid #27272a; padding: 0 24px; display: flex; align-items: center; height: 56px; }
        .admin-nav a { color: #a1a1aa; text-decoration: none; padding: 16px 16px; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; }
        .admin-nav a:hover, .admin-nav a.active { color: #e4e4e7; border-bottom-color: #4f8eff; }
        .admin-nav .spacer { flex: 1; }
        .admin-nav .brand { color: #4f8eff; font-weight: 700; font-size: 16px; margin-right: 24px; }
        .content { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 32px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .stat { background: #16161f; border: 1px solid #27272a; border-radius: 12px; padding: 24px; }
        .stat-label { font-size: 13px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 36px; font-weight: 700; margin-top: 4px; color: #4f8eff; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #a1a1aa; border-bottom: 1px solid #27272a; }
        td { padding: 12px 16px; border-bottom: 1px solid #1a1a24; font-size: 14px; }
        .btn { display: inline-block; padding: 8px 16px; background: #4f8eff; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #3b7aed; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-ghost { background: transparent; border: 1px solid #27272a; color: #a1a1aa; }
        .btn-ghost:hover { border-color: #4f8eff; color: #4f8eff; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .section-title { font-size: 20px; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <span class="brand">Admin</span>
        <a href="/admin" class="active">Dashboard</a>
        <a href="/admin/projects">Projects</a>
        <a href="/admin/profile">Profile</a>
        <a href="/admin/themes">Themes</a>
        <a href="/admin/analytics">Analytics</a>
        <span class="spacer"></span>
        <a href="/" target="_blank">View Site</a>
        <a href="/admin/logout">Logout</a>
    </nav>
    <div class="content">
        <h1>Dashboard</h1>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Projects</div>
                <div class="stat-value">{{ total_projects }}</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Views</div>
                <div class="stat-value">{{ total_views }}</div>
            </div>
        </div>
        <div class="toolbar">
            <h2 class="section-title">Recent Views</h2>
        </div>
        <table>
            <thead>
                <tr><th>Page</th><th>Project</th><th>IP</th><th>Time</th></tr>
            </thead>
            <tbody>
                {% for v in recent_views %}
                <tr>
                    <td>{{ v.page }}</td>
                    <td>{{ v.project_name or "—" }}</td>
                    <td>{{ v.ip_address }}</td>
                    <td>{{ v.viewed_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
