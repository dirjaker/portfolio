<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themes - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e4e4e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .admin-nav { background: #12121a; border-bottom: 1px solid #27272a; padding: 0 24px; display: flex; align-items: center; height: 56px; }
        .admin-nav a { color: #a1a1aa; text-decoration: none; padding: 16px 16px; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; }
        .admin-nav a:hover, .admin-nav a.active { color: #e4e4e7; border-bottom-color: #4f8eff; }
        .admin-nav .spacer { flex: 1; }
        .admin-nav .brand { color: #4f8eff; font-weight: 700; font-size: 16px; margin-right: 24px; }
        .content { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 32px; }
        .theme-card { background: #16161f; border: 1px solid #27272a; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .theme-card.active { border-color: #4f8eff; }
        .theme-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .theme-name { font-size: 18px; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #0d3320; color: #4ade80; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: #a1a1aa; margin-bottom: 6px; font-weight: 500; }
        input, textarea { width: 100%; padding: 10px 14px; background: #0a0a0f; border: 1px solid #27272a; border-radius: 8px; color: #e4e4e7; font-size: 14px; font-family: monospace; outline: none; }
        input:focus, textarea:focus { border-color: #4f8eff; }
        textarea { min-height: 160px; resize: vertical; }
        .btn { display: inline-block; padding: 8px 16px; background: #4f8eff; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #3b7aed; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .actions { display: flex; gap: 8px; }
        .inline-form { display: inline; }
        .new-theme { background: #16161f; border: 1px solid #27272a; border-radius: 12px; padding: 24px; margin-top: 32px; }
        .new-theme h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    </style>
</head>
<body>
    <nav class="admin-nav">
        <span class="brand">Admin</span>
        <a href="/admin">Dashboard</a>
        <a href="/admin/projects">Projects</a>
        <a href="/admin/profile">Profile</a>
        <a href="/admin/themes" class="active">Themes</a>
        <a href="/admin/analytics">Analytics</a>
        <span class="spacer"></span>
        <a href="/" target="_blank">View Site</a>
        <a href="/admin/logout">Logout</a>
    </nav>
    <div class="content">
        <h1>Themes</h1>
        {% for t in themes %}
        <div class="theme-card {{ 'active' if t.is_active }}">
            <div class="theme-header">
                <div>
                    <span class="theme-name">{{ t.name }}</span>
                    {% if t.is_active %}<span class="badge">Active</span>{% endif %}
                </div>
                <div class="actions">
                    <form class="inline-form" method="post" action="/admin/themes/{{ t.id }}/delete" onsubmit="return confirm('Delete this theme?')">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </div>
            </div>
            <form method="post" action="/admin/themes/save">
                <input type="hidden" name="tid" value="{{ t.id }}">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ t.name }}">
                </div>
                <div class="form-group">
                    <label>CSS Variables (JSON)</label>
                    <textarea name="css_vars">{{ t.css_vars }}</textarea>
                </div>
                <label><input type="checkbox" name="is_active" value="1" {{ 'checked' if t.is_active else '' }}> Set as active theme</label>
                <br><br>
                <button type="submit" class="btn btn-sm">Update Theme</button>
            </form>
        </div>
        {% endfor %}

        <div class="new-theme">
            <h2>New Theme</h2>
            <form method="post" action="/admin/themes/save">
                <input type="hidden" name="tid" value="0">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" value="" required>
                </div>
                <div class="form-group">
                    <label>CSS Variables (JSON)</label>
                    <textarea name="css_vars">{
    "--bg-primary": "#0a0a0f",
    "--bg-secondary": "#12121a",
    "--bg-card": "#16161f",
    "--text-primary": "#e4e4e7",
    "--text-secondary": "#a1a1aa",
    "--accent": "#4f8eff",
    "--accent-hover": "#3b7aed",
    "--border": "#27272a",
    "--shadow": "0 4px 24px rgba(0,0,0,0.4)"
}</textarea>
                </div>
                <label><input type="checkbox" name="is_active" value="1"> Set as active theme</label>
                <br><br>
                <button type="submit" class="btn">Create Theme</button>
            </form>
        </div>
    </div>
</body>
</html>
