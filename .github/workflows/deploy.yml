name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static site
        run: |
          python -c "
          import json
          from database import init_db, get_db
          init_db()
          db = get_db()
          profile = dict(db.execute('SELECT * FROM profile LIMIT 1').fetchone())
          theme = db.execute('SELECT * FROM theme WHERE is_active = 1 LIMIT 1').fetchone()
          theme_vars = json.loads(theme['css_vars']) if theme else {}
          projects = [dict(p) for p in db.execute('SELECT * FROM project WHERE is_visible = 1 ORDER BY sort_order ASC').fetchall()]
          db.close()

          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader('templates'))
          tpl = env.get_template('index.html')

          class FakeRequest:
              pass

          html = tpl.render(request=FakeRequest(), profile=profile, theme_vars=theme_vars)

          import os
          os.makedirs('public', exist_ok=True)
          with open('public/index.html', 'w') as f:
              f.write(html)
          "

      - name: Copy static assets
        run: |
          mkdir -p public/static/css
          cp static/css/style.css public/static/css/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
